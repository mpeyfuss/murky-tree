[project]
name = "murky-tree"
version = "1.0.0"
description = "A Python library to generate merkle trees and merkle proofs for Ethereum use."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["merkle-tree", "multiproof", "murky-tree"]
authors = [
    { name = "Marco Peyfuss", email = "82735893+mpeyfuss@users.noreply.github.com" },
]
dependencies = [
    "eth-abi>=5.2.0",
    "eth-utils>=6.0.0",
    "eth-hash[pycryptodome]>=0.8.0",
]

[project.urls]
repository = "https://github.com/mpeyfuss/murky-tree"

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "ruff>=0.16.1",
    "ty>=0.0.65",
    "pytest>=9.1.1",
    "pre-commit>=4.6.1",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Line length is managed by the formatter; don't fail lint on lines it can't wrap
# (e.g. long hex-hash literals in tests).
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
