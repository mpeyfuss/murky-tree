[project]
name = "murky-tree"
dynamic = ["version"]
description = "A Python library to generate merkle trees and merkle proofs for Ethereum use."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["merkle-tree", "multiproof", "murky-tree"]
authors = [
    { name = "Marco Peyfuss", email = "82735893+mpeyfuss@users.noreply.github.com" },
]
dependencies = [
    "eth-abi>=5.2.0",
    "eth-utils>=6.0.0",
]

[project.urls]
repository = "https://github.com/mpeyfuss/murky-tree"

[tool.uv]
exclude-newer = "7 days"
cache-keys = [
    { file = "pyproject.toml" },
    { file = "murky_tree_core/Cargo.toml" },
    { file = "murky_tree_core/Cargo.lock" },
    { file = "murky_tree_core/src/**/*.rs" },
]

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "murky_tree_core/Cargo.toml"
python-source = "."
module-name = "murky_tree._native"
features = ["python"]
include = [
    { path = "LICENSE", format = "sdist" },
    { path = "reference/vectors.json", format = "sdist" },
    { path = "tests/**/*.py", format = "sdist" },
]

[dependency-groups]
dev = [
    "eth-hash[pycryptodome]>=0.8.0",
    "ruff>=0.16.0",
    "ty>=0.0.64",
    "pytest>=9.1.1",
    "pre-commit>=4.6.1",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Line length is managed by the formatter; don't fail lint on lines it can't wrap
# (e.g. long hex-hash literals in tests).
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
