name: Wheels
on:
  push:
    # Branches only: release.yaml calls this workflow for release tags.
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to build and test
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      # Pure Python needs one universal wheel, tested on both supported endpoints.
      matrix:
        include:
          - { name: universal, runner: ubuntu-latest }
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Build universal wheel
        run: uv build --wheel --out-dir dist
      - name: Test installed wheel on Python 3.10 outside source tree
        shell: bash
        run: |
          python -m pip install dist/*.whl pytest
          mkdir -p "$RUNNER_TEMP/wheel-test/reference"
          cp -r tests "$RUNNER_TEMP/wheel-test/"
          cp reference/vectors.json "$RUNNER_TEMP/wheel-test/reference/"
          cd "$RUNNER_TEMP/wheel-test"
          python -m pytest -q tests
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Test the same wheel on Python 3.14
        shell: bash
        run: |
          python -m pip install dist/*.whl pytest
          cd "$RUNNER_TEMP/wheel-test"
          python -m pytest -q tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheels-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Build source distribution
        run: uv build --sdist --out-dir dist
      - name: Build and test the source distribution
        shell: bash
        run: |
          python -m pip install dist/*.tar.gz pytest
          mkdir -p "$RUNNER_TEMP/sdist-test/reference"
          cp -r tests "$RUNNER_TEMP/sdist-test/"
          cp reference/vectors.json "$RUNNER_TEMP/sdist-test/reference/"
          cd "$RUNNER_TEMP/sdist-test"
          python -m pytest -q tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
