name: CI

on:
  pull_request:
  push:
    # Branches only: release tags are built and tested by release.yaml.
    branches: ["**"]

jobs:
  test:
    name: Testing
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain set below
        with:
          toolchain: stable

      - name: Run tests
        run: uv run --locked pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain set below
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --check
        working-directory: murky_tree_core
      - run: cargo clippy --locked --all-targets --features python -- -D warnings
        working-directory: murky_tree_core
      - run: cargo test --locked
        working-directory: murky_tree_core
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check murky_tree tests
      - run: uv run --locked ty check

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master; toolchain set below
        with:
          toolchain: "1.83.0"
      - run: cargo check --locked --features python
        working-directory: murky_tree_core
